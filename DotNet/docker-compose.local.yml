# Lokal: docker compose -f docker-compose.yml -f docker-compose.local.yml up --build
services:
  web:
    ports:
      - "${LOCAL_WEB_PORT:-8080}:8080"
  pgweb:
    ports:
      - "${LOCAL_PGWEB_PORT:-8081}:8081"
  redis-commander:
    ports:
      - "${LOCAL_REDIS_UI_PORT:-8082}:8081"

networks:
  default:
    name: h3-local
    external: false
