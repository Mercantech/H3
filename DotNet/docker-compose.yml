# Dokploy-deploy: docker compose -f ./DotNet/docker-compose.yml up -d --build
#
# Routing (samme mønster som øvrige Mercantec-apps):
#   1. Cloudflare: *.mercantec.tech (wildcard CNAME → tunnel)
#   2. Tunnel ingress: *.mercantec.tech → http://localhost:80
#   3. Traefik (Dokploy): Host(`h3.mercantec.tech`) → web:8080
services:
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--save", "60", "1", "--loglevel", "warning"]
    volumes:
      - redis-data:/data
    networks:
      - internal
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s

  apiservice:
    build:
      context: .
      dockerfile: Docker/Dockerfile.apiservice
    restart: unless-stopped
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ASPNETCORE_FORWARDEDHEADERS_ENABLED: "true"
      ConnectionStrings__cache: redis:6379
      HealthChecks__Enabled: "true"
      Infisical__ClientId: ${INFISICAL__CLIENTID:-}
      Infisical__ClientSecret: ${INFISICAL__CLIENTSECRET:-}
      Infisical__ProjectId: ${INFISICAL__PROJECTID:-}
      Infisical__EnvironmentSlug: ${INFISICAL__ENVIRONMENTSLUG:-}
      Infisical__SecretPath: ${INFISICAL__SECRETPATH:-/}
      Infisical__HostUri: ${INFISICAL__HOSTURI:-}
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - internal
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s

  web:
    build:
      context: .
      dockerfile: Docker/Dockerfile.web
    restart: unless-stopped
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ASPNETCORE_FORWARDEDHEADERS_ENABLED: "true"
      ConnectionStrings__cache: redis:6379
      HealthChecks__Enabled: "true"
      services__apiservice__http__0: http://apiservice:8080
    depends_on:
      redis:
        condition: service_healthy
      apiservice:
        condition: service_healthy
    networks:
      - internal
      - dokploy-network
    labels:
      - traefik.enable=true
      - traefik.docker.network=dokploy-network
      - traefik.http.routers.h3-web.rule=Host(`${APP_DOMAIN:-h3.mercantec.tech}`)
      - traefik.http.routers.h3-web.entrypoints=web
      - traefik.http.routers.h3-web.service=h3-web
      - traefik.http.services.h3-web.loadbalancer.server.port=8080
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 25s

networks:
  dokploy-network:
    external: true
  internal:
    driver: bridge

volumes:
  redis-data:
